# ==============================================================================
# Konfigurasi Eksperimen Restorasi Wicara Cleft Lip and Palate
# Model: Score-Based Audio Diffusion Model (VP-SDE) + Adaptive Gain Normalization
# Mahasiswa: Muhamad Yasir Noval (2350081004) - Informatika UNJANI
# Pembimbing: Dr. Agus Komarudin, S.Kom., M.T.
# ==============================================================================

# Jalur Berkas dan Direktori
paths:
  # Jalur relatif fleksibel (dapat diarahkan ke Google Drive jika diperlukan)
  manifest_path: "dataset_manifest.csv"
  ultrasuite_base_dir: "data/UltraSuite"
  split_manifest_dir: "data/splits"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  result_dir: "results"

# Parameter Audio & Pra-Proses
audio:
  sample_rate: 22050
  channels: 1
  target_dbfs: -23.0           # EBU R128 standar industri
  max_gain_factor: 90.0        # Batas penguatan maksimum untuk audio sangat hening
  segment_length_sec: 2.0      # Panjang potongan audio saat pelatihan (~44.100 cuplikan)

# Parameter Transformasi STFT Kompleks
stft:
  n_fft: 512
  hop_length: 128              # Overlap 75%
  win_length: 512
  window_type: "hann"
  num_freq_bins: 257           # n_fft // 2 + 1

# Parameter Formulasi SDE Difusi Kontinu (VP-SDE)
sde:
  type: "VP"                   # Variance-Preserving SDE
  beta_min: 0.1
  beta_max: 20.0
  num_timesteps: 1000          # Resolusi diskritisasi kontinu
  eps: 1.0e-5                  # Minimum t untuk stabilitas numerik

# Parameter Arsitektur Jaringan Complex U-Net
model:
  in_channels: 2               # Real dan Imaginary masukan bernoise (X_t)
  cond_channels: 2             # Real dan Imaginary masukan kondisi (Y)
  out_channels: 2              # Real dan Imaginary penaksir skor gradien
  base_channels: 32            # Channel dasar pada layer pertama
  channel_mult: [1, 2, 4, 8]   # Multiplier channel per kedalaman U-Net
  num_res_blocks: 2            # Jumlah Residual Block per level
  time_embed_dim: 128          # Dimensi embedding waktu kontinu t
  dropout: 0.1

# Parameter Plosive-Weighted Hybrid Loss
loss:
  gamma_plosive: 0.25          # Bobot penalti pita frekuensi plosif (/p/, /t/, /k/)
  plosive_freq_min_hz: 1500    # Ambang bawah frekuensi letupan oral
  plosive_freq_max_hz: 8000    # Ambang atas frekuensi letupan oral

# Parameter Solver Inferensi (Reverse SDE)
solver:
  method: "heun"               # Metode Prediktor-Korektor Heun
  use_ode: true                # Menggunakan Deterministic Probability Flow ODE (bebas desis derau acak)
  num_steps: 30                # Few-step sampling efisien (30 langkah)
  corrector_steps: 0           # 0 untuk ODE murni yang stabil tanpa injeksi derau liar
  snr: 0.16

# Parameter Pelatihan (Training)
training:
  batch_size: 8
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  epochs: 100
  early_check_epoch: 10        # Evaluasi dini kualitas restorasi (Fail-Fast mechanism)
  max_allowed_wer: 30.0        # Batas ambang WER maksimum (%) pada epoch ke-10
  num_early_check_samples: 5   # Jumlah sampel validasi untuk uji cepat ASR
  grad_clip_norm: 1.0
  save_every_epochs: 5
  val_every_epochs: 1
  num_workers: 2
  seed: 42
